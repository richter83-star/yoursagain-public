# nginx config for the yoursagain.net static export (used by Dockerfile).
#
# TLS terminates at the proxy in front of this container (Coolify/Traefik),
# which forwards plain HTTP here with X-Forwarded-Proto set.

map $http_x_forwarded_proto $is_https {
  default 0;
  https   1;
}

map $is_https $hsts {
  1 "max-age=31536000; includeSubDomains";
  0 "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Emit relative Location headers so trailing-slash redirects keep the
  # visitor's scheme (previously they downgraded https -> http).
  absolute_redirect off;
  server_tokens off;

  # Force HTTPS when the proxy reports a plain-HTTP request.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # Security headers (repeated in each location that sets its own headers).
  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ohapewokvylhzuwcqdgn.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  add_header Strict-Transport-Security $hsts always;
  add_header Content-Security-Policy $csp always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Hashed build assets: cache for a year.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location /images/ {
    add_header Cache-Control "public, max-age=604800";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Old demo dashboard URL: send visitors to the client-updates page.
  location /portal/dashboard {
    return 301 /portal/;
  }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
}
